<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Outer Shield Outline -->
  <path d="M32 4 L54 12 V28 C54 44 32 58 32 58 C32 58 10 44 10 28 V12 Z" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round" fill="#0b1329" />
  
  <!-- Optical Eye / Camera Lens -->
  <circle cx="32" cy="25" r="10" stroke="url(#shieldGrad)" stroke-width="2.5" fill="#0f172a" />
  <circle cx="32" cy="25" r="5.5" fill="url(#eyeGrad)" />
  <circle cx="34" cy="23.5" r="1.8" fill="#ffffff" />
  
  <!-- Perspective Road Lines -->
  <path d="M32 35 L32 54" stroke="url(#shieldGrad)" stroke-width="2" stroke-dasharray="2 2" />
  <path d="M26 36 L15 54" stroke="url(#shieldGrad)" stroke-width="2.5" />
  <path d="M38 36 L49 54" stroke="url(#shieldGrad)" stroke-width="2.5" />
